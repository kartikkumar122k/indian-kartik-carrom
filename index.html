<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Indian Kartik Carrom</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#17120e;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#game{
    position:relative;
    width:min(94vw,700px);
    aspect-ratio:1/1;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    border-radius:18px;
    box-shadow:0 15px 50px #000;
    touch-action:none;
}

#title{
    position:absolute;
    top:-42px;
    left:0;
    width:100%;
    text-align:center;
    color:#f5d28b;
    font-size:20px;
    font-weight:bold;
}

#powerBox{
    position:absolute;
    bottom:-48px;
    left:10%;
    width:80%;
    height:18px;
    background:#33271f;
    border:2px solid #c9a66b;
    border-radius:20px;
    overflow:hidden;
}

#power{
    width:35%;
    height:100%;
    background:#e8b45b;
}

#hint{
    position:absolute;
    bottom:-80px;
    width:100%;
    text-align:center;
    color:#ddd;
    font-size:13px;
}
</style>
</head>

<body>

<div id="game">
    <div id="title">INDIAN KARTIK CARAM</div>

    <canvas id="board" width="700" height="700"></canvas>

    <div id="powerBox">
        <div id="power"></div>
    </div>

    <div id="hint">
        Drag from the striker to aim • Release to shoot
    </div>
</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

const W=700;
const H=700;

const board={
    x:55,
    y:55,
    size:590
};

const pocketR=25;

let striker={
    x:350,
    y:575,
    r:17,
    vx:0,
    vy:0
};

let coins=[];

const colors=["#eee","#171717"];

function addCoin(x,y,color){
    coins.push({
        x:x,
        y:y,
        r:14,
        vx:0,
        vy:0,
        color:color
    });
}

/* Centre formation */

addCoin(350,350,"#b82020");

const positions=[
    [350,320],[376,336],[376,366],
    [350,380],[324,366],[324,336]
];

positions.forEach((p,i)=>{
    addCoin(p[0],p[1],colors[i%2]);
});

/* More coins around centre */

for(let i=0;i<12;i++){
    const a=i*Math.PI*2/12;
    addCoin(
        350+Math.cos(a)*55,
        350+Math.sin(a)*55,
        colors[i%2]
    );
}

let dragging=false;
let aimX=350;
let aimY=575;

function drawBoard(){

    ctx.clearRect(0,0,W,H);

    /* Wooden outside */

    const wood=ctx.createLinearGradient(0,0,W,H);
    wood.addColorStop(0,"#8b4f25");
    wood.addColorStop(.5,"#c17a3c");
    wood.addColorStop(1,"#70401e");

    ctx.fillStyle=wood;
    ctx.fillRect(20,20,660,660);

    /* Board */

    const boardGrad=ctx.createLinearGradient(
        board.x,board.y,
        board.x+board.size,
        board.y+board.size
    );

    boardGrad.addColorStop(0,"#f4d7a1");
    boardGrad.addColorStop(1,"#d6a866");

    ctx.fillStyle=boardGrad;
    ctx.fillRect(board.x,board.y,board.size,board.size);

    /* Lines */

    ctx.strokeStyle="#6e2d20";
    ctx.lineWidth=4;

    ctx.strokeRect(90,90,520,520);

    /* Centre circle */

    ctx.beginPath();
    ctx.arc(350,350,42,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(350,350,8,0,Math.PI*2);
    ctx.fillStyle="#8b1e1e";
    ctx.fill();

    /* Baseline */

    ctx.beginPath();
    ctx.moveTo(170,575);
    ctx.lineTo(530,575);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(170,600);
    ctx.lineTo(530,600);
    ctx.stroke();

    /* Pockets */

    const pockets=[
        [80,80],
        [620,80],
        [80,620],
        [620,620]
    ];

    pockets.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p[0],p[1],pocketR,0,Math.PI*2);
        ctx.fillStyle="#111";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(p[0],p[1],pocketR-7,0,Math.PI*2);
        ctx.strokeStyle="#422";
        ctx.stroke();
    });

    /* Coins */

    coins.forEach(c=>{
        drawPiece(c.x,c.y,c.r,c.color);
    });

    /* Striker */

    drawPiece(
        striker.x,
        striker.y,
        striker.r,
        "#eeeeee"
    );

    ctx.beginPath();
    ctx.arc(
        striker.x,
        striker.y,
        striker.r-5,
        0,
        Math.PI*2
    );

    ctx.strokeStyle="#9b2222";
    ctx.lineWidth=3;
    ctx.stroke();

    /* Aim line */

    if(dragging){

        ctx.beginPath();
        ctx.moveTo(striker.x,striker.y);
        ctx.lineTo(aimX,aimY);

        ctx.strokeStyle="rgba(120,60,20,.8)";
        ctx.lineWidth=3;
        ctx.setLineDash([8,8]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

function drawPiece(x,y,r,color){

    const g=ctx.createRadialGradient(
        x-r/3,
        y-r/3,
        2,
        x,
        y,
        r
    );

    g.addColorStop(0,"#ffffff");
    g.addColorStop(.25,color);
    g.addColorStop(1,"#222");

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=g;
    ctx.fill();

    ctx.strokeStyle="#222";
    ctx.lineWidth=2;
    ctx.stroke();
}

function update(){

    striker.x+=striker.vx;
    striker.y+=striker.vy;

    striker.vx*=.985;
    striker.vy*=.985;

    if(Math.abs(striker.vx)<.05)striker.vx=0;
    if(Math.abs(striker.vy)<.05)striker.vy=0;

    /* Wall collision */

    const min=95;
    const max=605;

    if(striker.x<min){
        striker.x=min;
        striker.vx*=-.85;
    }

    if(striker.x>max){
        striker.x=max;
        striker.vx*=-.85;
    }

    if(striker.y<min){
        striker.y=min;
        striker.vy*=-.85;
    }

    if(striker.y>max){
        striker.y=max;
        striker.vy*=-.85;
    }

    /* Coin physics */

    coins.forEach(c=>{

        c.x+=c.vx;
        c.y+=c.vy;

        c.vx*=.985;
        c.vy*=.985;

        if(Math.abs(c.vx)<.04)c.vx=0;
        if(Math.abs(c.vy)<.04)c.vy=0;

        if(c.x<105){
            c.x=105;
            c.vx*=-.8;
        }

        if(c.x>595){
            c.x=595;
            c.vx*=-.8;
        }

        if(c.y<105){
            c.y=105;
            c.vy*=-.8;
        }

        if(c.y>595){
            c.y=595;
            c.vy*=-.8;
        }

        /* striker collision */

        const dx=c.x-striker.x;
        const dy=c.y-striker.y;
        const d=Math.hypot(dx,dy);

        if(d<c.r+striker.r && d>0){

            const nx=dx/d;
            const ny=dy/d;

            const push=2;

            c.vx+=nx*push;
            c.vy+=ny*push;

            striker.vx-=nx*.5;
            striker.vy-=ny*.5;
        }
    });
}

function loop(){

    update();
    drawBoard();

    requestAnimationFrame(loop);
}

function pointerPosition(e){

    const rect=canvas.getBoundingClientRect();

    return {
        x:(e.clientX-rect.left)*700/rect.width,
        y:(e.clientY-rect.top)*700/rect.height
    };
}

canvas.addEventListener("pointerdown",e=>{

    const p=pointerPosition(e);

    const d=Math.hypot(
        p.x-striker.x,
        p.y-striker.y
    );

    if(d<40 && striker.vx===0 && striker.vy===0){

        dragging=true;

        aimX=p.x;
        aimY=p.y;

        canvas.setPointerCapture(e.pointerId);
    }
});

canvas.addEventListener("pointermove",e=>{

    if(!dragging)return;

    const p=pointerPosition(e);

    aimX=p.x;
    aimY=p.y;

    const dx=striker.x-p.x;
    const dy=striker.y-p.y;

    const power=Math.min(
        100,
        Math.hypot(dx,dy)/2
    );

    document.getElementById("power").style.width=
        power+"%";
});

canvas.addEventListener("pointerup",e=>{

    if(!dragging)return;

    dragging=false;

    const dx=striker.x-aimX;
    const dy=striker.y-aimY;

    const power=Math.min(
        18,
        Math.hypot(dx,dy)/15
    );

    striker.vx=dx/Math.max(1,Math.hypot(dx,dy))*power;
    striker.vy=dy/Math.max(1,Math.hypot(dx,dy))*power;
});

loop();
</script>

</body>
</html>
