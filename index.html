<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Indian Kartik Carrom</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  color:white;
}
body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  width:100%;
  max-width:760px;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:
    radial-gradient(circle at 50% 15%,#333,#111 70%);
}

#topbar{
  width:100%;
  max-width:700px;
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}

.stats{
  display:flex;
  gap:10px;
}

.stat{
  background:#242424;
  border:1px solid #444;
  border-radius:10px;
  padding:7px 11px;
  font-size:13px;
}

#boardWrap{
  position:relative;
  width:min(94vw,700px);
  aspect-ratio:1;
  margin:auto 0;
  padding:12px;
  border-radius:24px;
  background:
    linear-gradient(135deg,#321607,#9a5721 25%,#4d210c 55%,#b66b2b 80%,#351609);
  box-shadow:
    0 20px 45px rgba(0,0,0,.65),
    inset 0 0 0 4px #251005,
    inset 0 0 0 8px #c17a3a;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:14px;
  touch-action:none;
  background:#e4b66e;
}

#controls{
  width:min(94vw,700px);
  padding:8px 0 12px;
  display:flex;
  gap:8px;
  align-items:center;
}

button{
  border:0;
  color:white;
  font-weight:bold;
  border-radius:12px;
  padding:12px 14px;
  background:#292929;
  box-shadow:0 4px 10px rgba(0,0,0,.35);
}

button:active{
  transform:scale(.96);
}

#power{
  flex:1;
  height:16px;
  accent-color:#e8a43b;
}

#powerText{
  width:45px;
  text-align:center;
  font-size:12px;
}

#message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.78);
  border:1px solid #777;
  padding:14px 20px;
  border-radius:14px;
  font-weight:bold;
  pointer-events:none;
  opacity:0;
  transition:.2s;
}
</style>
</head>

<body>

<div id="game">

  <div id="topbar">
    <div class="logo">INDIAN KARTIK CARROM</div>

    <div class="stats">
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">Turn: <span id="turn">1</span></div>
    </div>
  </div>

  <div id="boardWrap">
    <canvas id="canvas"></canvas>
    <div id="message"></div>
  </div>

  <div id="controls">
    <button id="left">◀</button>
    <input id="power" type="range" min="10" max="100" value="55">
    <div id="powerText">55%</div>
    <button id="right">▶</button>
    <button id="reset">↻</button>
  </div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=700,H=700;
let scale=1;

function resize(){
  const r=canvas.getBoundingClientRect();
  scale=devicePixelRatio||1;
  canvas.width=W*scale;
  canvas.height=H*scale;
  ctx.setTransform(scale,0,0,scale,0,0);
}
resize();
window.addEventListener("resize",resize);

const pockets=[
  {x:42,y:42},
  {x:658,y:42},
  {x:42,y:658},
  {x:658,y:658}
];

const center={x:350,y:350};

let striker;
let coins=[];
let score=0;
let turn=1;
let moving=false;
let aiming=false;
let aimX=350;
let aimY=150;

function makeCoin(x,y,color){
  return {
    x,y,
    vx:0,
    vy:0,
    r:15,
    color,
    alive:true
  };
}

function resetGame(){

  score=0;
  turn=1;
  moving=false;
  aiming=false;

  document.getElementById("score").textContent=score;
  document.getElementById("turn").textContent=turn;

  coins=[];

  coins.push(makeCoin(350,350,"queen"));

  const positions=[
    [350,318],[378,334],[378,366],
    [350,382],[322,366],[322,334],
    [350,286],[378,302],[406,350],
    [378,398],[350,414],[322,398],
    [294,350],[322,302]
  ];

  positions.forEach((p,i)=>{
    coins.push(
      makeCoin(
        p[0],
        p[1],
        i%2===0 ? "white":"black"
      )
    );
  });

  striker={
    x:350,
    y:605,
    vx:0,
    vy:0,
    r:19,
    color:"striker"
  };
}

resetGame();

function drawBoard(){

  ctx.clearRect(0,0,W,H);

  const wood=ctx.createLinearGradient(0,0,W,H);
  wood.addColorStop(0,"#f3ca82");
  wood.addColorStop(.25,"#dba15b");
  wood.addColorStop(.5,"#f0c77c");
  wood.addColorStop(.75,"#cf9550");
  wood.addColorStop(1,"#edbd70");

  ctx.fillStyle=wood;
  ctx.fillRect(0,0,W,H);

  // wood grain
  ctx.globalAlpha=.12;
  ctx.strokeStyle="#5b2c0c";
  ctx.lineWidth=2;

  for(let i=0;i<70;i++){
    const y=10+i*10;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.bezierCurveTo(
      180,y-8,
      430,y+10,
      700,y-4
    );
    ctx.stroke();
  }

  ctx.globalAlpha=1;

  // inner frame
  ctx.strokeStyle="#71390e";
  ctx.lineWidth=7;
  ctx.strokeRect(25,25,650,650);

  ctx.strokeStyle="#f5d38e";
  ctx.lineWidth=2;
  ctx.strokeRect(34,34,632,632);

  // baseline
  ctx.strokeStyle="#8b3f14";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(150,600);
  ctx.lineTo(550,600);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(150,615);
  ctx.lineTo(550,615);
  ctx.stroke();

  // center circle
  ctx.beginPath();
  ctx.arc(350,350,52,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(350,350,8,0,Math.PI*2);
  ctx.fillStyle="#9b3b18";
  ctx.fill();

  // diagonals
  ctx.beginPath();
  ctx.moveTo(90,90);
  ctx.lineTo(610,610);
  ctx.moveTo(610,90);
  ctx.lineTo(90,610);
  ctx.strokeStyle="rgba(120,50,10,.55)";
  ctx.lineWidth=2;
  ctx.stroke();

  // pockets
  pockets.forEach(p=>{
    const g=ctx.createRadialGradient(
      p.x-4,p.y-4,2,
      p.x,p.y,25
    );

    g.addColorStop(0,"#000");
    g.addColorStop(.7,"#111");
    g.addColorStop(1,"#4b250e");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(p.x,p.y,24,0,Math.PI*2);
    ctx.fill();
  });
}

function drawCoin(c){

  if(!c.alive)return;

  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.55)";
  ctx.shadowBlur=8;
  ctx.shadowOffsetY=5;

  const g=ctx.createRadialGradient(
    c.x-c.r*.35,
    c.y-c.r*.4,
    2,
    c.x,
    c.y,
    c.r
  );

  if(c.color==="white"){
    g.addColorStop(0,"#fff");
    g.addColorStop(.55,"#eee");
    g.addColorStop(1,"#a8a8a8");
  }
  else if(c.color==="black"){
    g.addColorStop(0,"#777");
    g.addColorStop(.3,"#292929");
    g.addColorStop(1,"#050505");
  }
  else{
    g.addColorStop(0,"#ff8c72");
    g.addColorStop(.4,"#d92917");
    g.addColorStop(1,"#650b08");
  }

  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
  ctx.fill();

  ctx.shadowColor="transparent";

  ctx.strokeStyle=
    c.color==="white" ? "#777" :
    c.color==="black" ? "#aaa" : "#4b0000";

  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.restore();
}

function drawStriker(){

  const c=striker;

  ctx.save();

  ctx.shadowColor="rgba(0,0,0,.6)";
  ctx.shadowBlur=10;
  ctx.shadowOffsetY=6;

  const g=ctx.createRadialGradient(
    c.x-7,c.y-8,2,
    c.x,c.y,c.r
  );

  g.addColorStop(0,"#fff");
  g.addColorStop(.4,"#e9e9e9");
  g.addColorStop(.8,"#bdbdbd");
  g.addColorStop(1,"#777");

  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
  ctx.fill();

  ctx.shadowColor="transparent";

  ctx.strokeStyle="#333";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(c.x,c.y,8,0,Math.PI*2);
  ctx.strokeStyle="#9c391b";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.restore();
}

function drawAim(){

  if(!aiming || moving)return;

  const dx=aimX-striker.x;
  const dy=aimY-striker.y;
  const len=Math.sqrt(dx*dx+dy*dy);

  if(len<5)return;

  const nx=dx/len;
  const ny=dy/len;

  const length=160;

  ctx.save();

  ctx.strokeStyle="rgba(255,255,255,.85)";
  ctx.lineWidth=2;
  ctx.setLineDash([8,7]);

  ctx.beginPath();
  ctx.moveTo(striker.x,striker.y);
  ctx.lineTo(
    striker.x+nx*length,
    striker.y+ny*length
  );
  ctx.stroke();

  ctx.setLineDash([]);

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(
    striker.x+nx*length,
    striker.y+ny*length,
    4,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.restore();
}

function draw(){

  drawBoard();

  coins.forEach(drawCoin);

  drawStriker();

  drawAim();
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function collide(a,b){

  if(!a.alive || !b.alive)return;

  const dx=b.x-a.x;
  const dy=b.y-a.y;
  const d=Math.hypot(dx,dy);

  const min=a.r+b.r;

  if(d===0 || d>min)return;

  const nx=dx/d;
  const ny=dy/d;

  const rvx=b.vx-a.vx;
  const rvy=b.vy-a.vy;

  const vel=rvx*nx+rvy*ny;

  if(vel>0)return;

  const impulse=-vel*.9;

  a.vx-=impulse*nx;
  a.vy-=impulse*ny;

  b.vx+=impulse*nx;
  b.vy+=impulse*ny;

  const overlap=min-d;

  a.x-=nx*overlap/2;
  a.y-=ny*overlap/2;

  b.x+=nx*overlap/2;
  b.y+=ny*overlap/2;
}

function pocketCheck(c){

  if(!c.alive)return;

  for(const p of pockets){

    if(Math.hypot(c.x-p.x,c.y-p.y)<27){

      c.alive=false;

      if(c.color==="queen"){
        score+=50;
        showMessage("QUEEN! +50");
      }
      else{
        score+=10;
        showMessage("+10");
      }

      document.getElementById("score").textContent=score;

      return;
    }
  }
}

function update(){

  const all=[striker,...coins];

  all.forEach(c=>{

    if(!c.alive)return;

    c.x+=c.vx;
    c.y+=c.vy;

    c.vx*=.985;
    c.vy*=.985;

    if(Math.abs(c.vx)<.025)c.vx=0;
    if(Math.abs(c.vy)<.025)c.vy=0;

    const min=48;
    const max=652;

    if(c.x-c.r<min){
      c.x=min+c.r;
      c.vx=Math.abs(c.vx)*.72;
    }

    if(c.x+c.r>max){
      c.x=max-c.r;
      c.vx=-Math.abs(c.vx)*.72;
    }

    if(c.y-c.r<min){
      c.y=min+c.r;
      c.vy=Math.abs(c.vy)*.72;
    }

    if(c.y+c.r>max){
      c.y=max-c.r;
      c.vy=-Math.abs(c.vy)*.72;
    }

    pocketCheck(c);
  });

  for(let i=0;i<all.length;i++){
    for(let j=i+1;j<all.length;j++){
      collide(all[i],all[j]);
    }
  }

  const active=all.some(
    c=>c.alive && (Math.abs(c.vx)+Math.abs(c.vy))>.03
  );

  if(moving && !active){

    moving=false;
    striker.vx=0;
    striker.vy=0;

    setTimeout(()=>{
      turn++;
      document.getElementById("turn").textContent=turn;

      striker.x=350;
      striker.y=605;

      showMessage("YOUR TURN");
    },300);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

function pointerPosition(e){

  const r=canvas.getBoundingClientRect();

  return {
    x:(e.clientX-r.left)*W/r.width,
    y:(e.clientY-r.top)*H/r.height
  };
}

canvas.addEventListener("pointerdown",e=>{

  if(moving)return;

  const p=pointerPosition(e);

  if(Math.hypot(
    p.x-striker.x,
    p.y-striker.y
  )<45){

    aiming=true;
    aimX=p.x;
    aimY=p.y;

    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener("pointermove",e=>{

  if(!aiming)return;

  const p=pointerPosition(e);

  aimX=p.x;
  aimY=p.y;
});

canvas.addEventListener("pointerup",e=>{

  if(!aiming)return;

  aiming=false;

  const dx=aimX-striker.x;
  const dy=aimY-striker.y;

  const len=Math.hypot(dx,dy);

  if(len<20)return;

  const power=
    Number(document.getElementById("power").value)/100;

  const maxSpeed=18;

  striker.vx=(dx/len)*maxSpeed*power;
  striker.vy=(dy/len)*maxSpeed*power;

  moving=true;
});

document.getElementById("power").addEventListener("input",e=>{
  document.getElementById("powerText").textContent=e.target.value+"%";
});

document.getElementById("left").addEventListener("click",()=>{
  if(!moving){
    striker.x-=18;
    if(striker.x<150)striker.x=150;
  }
});

document.getElementById("right").addEventListener("click",()=>{
  if(!moving){
    striker.x+=18;
    if(striker.x>550)striker.x=550;
  }
});

document.getElementById("reset").addEventListener("click",()=>{
  resetGame();
});

function showMessage(text){

  const m=document.getElementById("message");

  m.textContent=text;
  m.style.opacity=1;

  setTimeout(()=>{
    m.style.opacity=0;
  },900);
}
</script>

</body>
</html>
